
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Great Lansba Realtors</title>

    <style>
        :root {
            --deep-emerald: #013515;
            --dark-green: #023216;
            --gold: #E0A63F;
            --white: #F4F5F4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f4;
            color: #222;
            overflow-x: hidden;
        }

        /* GALLERY HEADER */

        .gallery-header {
            background: linear-gradient(135deg, #013515, #025023);
            color: white;
            text-align: center;
            padding: 65px 20px;
            position: relative;
            overflow: hidden;
            animation: headerReveal 1s ease both;
        }

        .gallery-header::before,
        .gallery-header::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(224,166,63,0.25);
            border-radius: 50%;
            animation: floatingCircle 8s ease-in-out infinite;
        }

        .gallery-header::before {
            top: -130px;
            left: -60px;
        }

        .gallery-header::after {
            bottom: -150px;
            right: -60px;
            animation-delay: 2s;
        }

        /* BACK TO HOME BUTTON */

        .back-home-btn {
            display: inline-block;
            position: absolute;
            top: 25px;
            left: 30px;
            background: var(--gold);
            color: var(--deep-emerald);
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 5;
        }

        .back-home-btn:hover {
            background: white;
            color: var(--deep-emerald);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .gallery-header h1 {
            font-size: 40px;
            margin-bottom: 14px;
            color: var(--gold);
            animation: titleReveal 1s ease 0.2s both;
        }

        .gallery-header p {
            font-size: 16px;
            line-height: 1.7;
            animation: titleReveal 1s ease 0.4s both;
        }

        /* GALLERY LAYOUT */

        .gallery-container {
            max-width: 1450px;
            margin: auto;
            padding: 55px 25px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 190px;
            gap: 20px;
        }

        /* DIFFERENT IMAGE SIZES */

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            background: #ddd;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);

            opacity: 0;
            transform: translateY(45px) scale(0.96);

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(.2,.7,.2,1),
                box-shadow 0.4s ease;
        }

        .gallery-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .gallery-item:nth-child(7n + 1) {
            grid-row: span 2;
        }

        .gallery-item:nth-child(7n + 3) {
            grid-column: span 2;
        }

        .gallery-item:nth-child(11n + 5) {
            grid-row: span 2;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition:
                transform 0.8s cubic-bezier(.2,.7,.2,1),
                filter 0.5s ease;
        }

        /* HOVER EFFECT */

        .gallery-item:hover {
            box-shadow: 0 15px 35px rgba(0,0,0,0.20);
            z-index: 2;
        }

        .gallery-item:hover img {
            transform: scale(1.10);
            filter: brightness(0.85);
        }

        .gallery-item::after {
            content: "VIEW PHOTO";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -40%);
            color: white;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .gallery-item:hover::after {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        /* LIGHTBOX */

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 5px;
            animation: photoZoom 0.35s ease;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 45px;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .close-lightbox:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 45px;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            transition: color 0.3s ease;
        }

        .lightbox-arrow:hover {
            color: var(--gold);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ANIMATIONS */

        @keyframes headerReveal {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatingCircle {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(25px) rotate(20deg);
            }
        }

        @keyframes photoZoom {
            from {
                opacity: 0;
                transform: scale(0.88);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* TABLET */

        @media (max-width: 1000px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 180px;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .gallery-header {
                padding: 65px 15px 45px;
            }

            .back-home-btn {
                top: 12px;
                left: 12px;
                padding: 9px 15px;
                font-size: 12px;
            }

            .gallery-header h1 {
                font-size: 29px;
            }

            .gallery-header p {
                font-size: 14px;
            }

            .gallery-container {
                padding: 25px 12px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 145px;
                gap: 10px;
            }

            .gallery-item:nth-child(7n + 3) {
                grid-column: span 1;
            }

            .gallery-item:nth-child(7n + 1),
            .gallery-item:nth-child(11n + 5) {
                grid-row: span 2;
            }

            .lightbox {
                padding: 15px;
            }

            .lightbox img {
                max-width: 100%;
                max-height: 80vh;
            }

            .close-lightbox {
                top: 10px;
                right: 18px;
                font-size: 38px;
            }

            .lightbox-arrow {
                font-size: 35px;
            }

            .lightbox-prev {
                left: 2px;
            }

            .lightbox-next {
                right: 2px;
            }
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

            .gallery-item {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>

    <!-- GALLERY HEADER -->

    <header class="gallery-header">

        <a href="index.html" class="back-home-btn">
            &#8592; Back to Home
        </a>

        <h1>Our Gallery</h1>

        <p>
            Moments, memories and experiences with the Great Lansba Realtors team.
        </p>

    </header>

    <!-- GALLERY IMAGES -->

    <main class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- IMAGE LIGHTBOX -->

    <div class="lightbox" id="lightbox">

        <span class="close-lightbox" id="closeLightbox">&times;</span>

        <span class="lightbox-arrow lightbox-prev" id="prevImage">&#10094;</span>

        <img src="" alt="Great Lansba team photograph" id="lightboxImage">

        <span class="lightbox-arrow lightbox-next" id="nextImage">&#10095;</span>

        <div class="lightbox-counter" id="lightboxCounter"></div>

    </div>

    <script>

        const galleryImages = [

            "DSC_0359@50139122.jpg.jpeg",
            "DSC_0371@100009256.jpg.jpeg",
            "DSC_0374@102779819.jpg.jpeg",
            "DSC_0375@103703340.jpg.jpeg",
            "DSC_0376@104626861.jpg.jpeg",
            "DSC_0380@127714886.jpg.jpeg",
            "DSC_0385@132332491.jpg.jpeg",
            "DSC_0386@133256012.jpg.jpeg",
            "DSC_0388@135103054.jpg.jpeg",
            "DSC_0389@136026575.jpg.jpeg",
            "DSC_0390@156344037.jpg.jpeg",
            "DSC_0392@158191079.jpg.jpeg",
            "DSC_0393@159114600.jpg.jpeg",
            "DSC_0394@160038121.jpg.jpeg",
            "DSC_0395@160961642.jpg.jpeg",
            "DSC_0396@161885163.jpg.jpeg",
            "DSC_0398@163732205.jpg.jpeg",
            "DSC_0399@164655726.jpg.jpeg",
            "DSC_0401@787108880.jpg.jpeg",
            "DSC_0403@788955922.jpg.jpeg",
            "DSC_0408@793573527.jpg (1).jpeg",
            "DSC_0408@793573527.jpg.jpeg",
            "DSC_0412@816661552.jpg.jpeg",
            "DSC_0417@821279157.jpg.jpeg",
            "DSC_0421@844367182.jpg (1).jpeg",
            "DSC_0421@844367182.jpg.jpeg",
            "DSC_0427@849908308.jpg.jpeg",
            "DSC_0429@851755350.jpg.jpeg",
            "nimrod-wanyama-property-manager.jpeg",
            "WhatsApp Image 2026-11-07 at 1.29.36 AM (1).jpeg",
            "WhatsApp Image 2026-11-07 at 1.29.36 AM.jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.38 AM (1).jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.38 AM.jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.39 AM.jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.40 AM.jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.41 AM (1).jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.41 AM.jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.42 AM (1).jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.42 AM (2).jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.42 AM (3).jpeg",
            "WhatsApp Image 2026-11-07 at 2.24.42 AM.jpeg"

        ];

        const galleryGrid = document.getElementById("galleryGrid");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxCounter = document.getElementById("lightboxCounter");

        let currentImageIndex = 0;
        const loadedImages = [];

        galleryImages.forEach((filename, index) => {

            const item = document.createElement("div");
            item.className = "gallery-item";

            const img = document.createElement("img");

            img.src = "images/gallery/" + filename;
            img.alt = "Great Lansba team photograph " + (index + 1);
            img.loading = "lazy";

            img.onerror = function () {
                item.remove();
                console.error("Image not found:", filename);
            };

            img.onload = function () {
                loadedImages.push(img);
            };

            item.appendChild(img);
            galleryGrid.appendChild(item);

            item.addEventListener("click", () => {

                currentImageIndex = loadedImages.indexOf(img);

                if (currentImageIndex !== -1) {
                    showLightboxImage();
                }

            });

        });

        /* SCROLL REVEAL ANIMATION */

        const observer = new IntersectionObserver((entries, observer) => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add("visible");
                    observer.unobserve(entry.target);

                }

            });

        }, {
            threshold: 0.12
        });

        document.querySelectorAll(".gallery-item").forEach((item, index) => {

            item.style.transitionDelay = (index % 8) * 80 + "ms";
            observer.observe(item);

        });

        /* LIGHTBOX FUNCTIONS */

        function showLightboxImage() {

            const selectedImage = loadedImages[currentImageIndex];

            if (!selectedImage) return;

            lightboxImage.src = selectedImage.src;

            lightboxCounter.textContent =
                (currentImageIndex + 1) + " / " + loadedImages.length;

            lightbox.classList.add("active");

            document.body.style.overflow = "hidden";

        }

        function closeLightbox() {

            lightbox.classList.remove("active");

            document.body.style.overflow = "";

        }

        function nextImage() {

            if (loadedImages.length === 0) return;

            currentImageIndex =
                (currentImageIndex + 1) % loadedImages.length;

            showLightboxImage();

        }

        function previousImage() {

            if (loadedImages.length === 0) return;

            currentImageIndex =
                (currentImageIndex - 1 + loadedImages.length) % loadedImages.length;

            showLightboxImage();

        }

        document.getElementById("closeLightbox")
            .addEventListener("click", closeLightbox);

        document.getElementById("nextImage")
            .addEventListener("click", nextImage);

        document.getElementById("prevImage")
            .addEventListener("click", previousImage);

        lightbox.addEventListener("click", event => {

            if (event.target === lightbox) {
                closeLightbox();
            }

        });

        document.addEventListener("keydown", event => {

            if (!lightbox.classList.contains("active")) return;

            if (event.key === "Escape") closeLightbox();

            if (event.key === "ArrowRight") nextImage();

            if (event.key === "ArrowLeft") previousImage();

        });

    </script>

</body>
</html>
